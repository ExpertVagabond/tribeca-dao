[package]
name = "govern"
version = "0.5.1"
description = "Handles proposal creation, lifecycle, voting, and execution."
edition = "2021"
homepage = "https://tribeca.so"
repository = "https://github.com/TribecaHQ/tribeca"
authors = ["Tribeca Team <team@tribeca.so>"]
license = "AGPL-3.0"
keywords = ["solana", "anchor", "governance", "tribeca"]

[lib]
crate-type = ["cdylib", "lib"]
name = "govern"

[features]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
num-traits = "0.2"
smart-wallet = { path = "../smart-wallet", features = ["cpi"] }

[dev-dependencies]
proptest = { version = "1.0" }
